[project]
name = "context-eng-hero-scripts"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
relative_files = true
