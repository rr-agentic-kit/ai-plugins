name: python-quality

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
      - "release/**"
      - "hotfix/**"
  push:
    branches:
      - master
      - "release/**"
      - "hotfix/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-base-guard:
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-release PRs into master
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" == release/* || "$HEAD_REF" == hotfix/* ]]; then
            echo "Allowed PR head for master: $HEAD_REF"
            exit 0
          fi
          echo "PRs into master must come from release/** or hotfix/** (head: $HEAD_REF)" >&2
          exit 1

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Validate plugin versions
        run: uv run python scripts/validate_plugin_versions.py

      - name: Ruff
        run: uv run ruff check plugins/context-eng-hero/scripts plugins/rrraw/scripts scripts tests/context-eng-hero tests/rrraw tests/scripts

      - name: Black
        run: uv run black --check plugins/context-eng-hero/scripts plugins/rrraw/scripts scripts tests/context-eng-hero tests/rrraw tests/scripts

      - name: Mypy
        run: uv run mypy

      - name: Bandit
        run: uv run bandit -r plugins/context-eng-hero/scripts plugins/rrraw/scripts -c pyproject.toml

      - name: Export requirements for pip-audit
        run: uv export --frozen --format requirements.txt -o /tmp/requirements.txt

      - name: pip-audit
        run: uv run pip-audit -r /tmp/requirements.txt

      - name: Pytest with coverage
        run: |
          uv run pytest tests/ -v \
            --cov=plugins/context-eng-hero/scripts \
            --cov=plugins/rrraw/scripts \
            --cov=scripts \
            --cov-report=term-missing \
            --cov-report=xml

  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Pytest with coverage (for Sonar)
        run: |
          uv run pytest tests/ -v \
            --cov=plugins/context-eng-hero/scripts \
            --cov=plugins/rrraw/scripts \
            --cov=scripts \
            --cov-report=xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
