name: python-quality

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Validate plugin versions
        run: uv run python scripts/validate_plugin_versions.py

      - name: Ruff
        run: uv run ruff check plugins/context-eng-hero/scripts plugins/rrraw/scripts scripts tests/context-eng-hero tests/rrraw tests/scripts

      - name: Black
        run: uv run black --check plugins/context-eng-hero/scripts plugins/rrraw/scripts scripts tests/context-eng-hero tests/rrraw tests/scripts

      - name: Mypy
        run: uv run mypy

      - name: Bandit
        run: uv run bandit -r plugins/context-eng-hero/scripts plugins/rrraw/scripts -c pyproject.toml

      - name: Export requirements for pip-audit
        run: uv export --frozen --format requirements.txt -o /tmp/requirements.txt

      - name: pip-audit
        run: uv run pip-audit -r /tmp/requirements.txt

      - name: Pytest with coverage
        run: |
          uv run pytest tests/ -v \
            --cov=plugins/context-eng-hero/scripts/audit_static \
            --cov=plugins/rrraw/scripts/validate_planning \
            --cov-report=term-missing \
            --cov-report=xml

  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Pytest with coverage (for Sonar)
        run: |
          uv run pytest tests/ -v \
            --cov=plugins/context-eng-hero/scripts/audit_static \
            --cov=plugins/rrraw/scripts/validate_planning \
            --cov-report=xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
