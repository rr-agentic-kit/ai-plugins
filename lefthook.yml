# Local git hooks. Install: `lefthook install`
# Mirrors .github/workflows/python-quality.yml plus GitHub config checks.
# Tool versions via `uv run` / uv.lock (same as CI).
# Version bumps are manual / release-control — not this hook.

# doublestar: ** matches any depth including zero (scripts/*.py, not only nested).
glob_matcher: doublestar

# Keep signal without flooding: summary timings + failures only.
# Avoid follow+parallel (lefthook docs: messy/hang-prone).
output:
  - meta
  - summary
  - failure
  - execution_info
  - skips

pre-commit:
  parallel: true
  jobs:
    - name: whitespace
      timeout: 3m
      # --no-pager: under a TTY lefthook, bare `git diff` waits on less forever.
      run: git --no-pager diff --cached --check

    - name: check-yaml
      timeout: 3m
      glob: "*.{yml,yaml}"
      run: |
        uv run python -c '
        import sys
        from pathlib import Path
        import yaml
        e = 0
        for p in sys.argv[1:]:
            try:
                yaml.safe_load(Path(p).read_text(encoding="utf-8"))
            except Exception as exc:
                print(f"{p}: {exc}")
                e = 1
        raise SystemExit(e)
        ' {staged_files}

    - name: check-json
      timeout: 3m
      glob: ".github/**/*.json"
      run: |
        uv run python -c '
        import json, sys
        from pathlib import Path
        e = 0
        for p in sys.argv[1:]:
            try:
                json.loads(Path(p).read_text(encoding="utf-8"))
            except Exception as exc:
                print(f"{p}: {exc}")
                e = 1
        raise SystemExit(e)
        ' {staged_files}

    - name: actionlint
      timeout: 3m
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}

    - name: validate-plugin-versions
      timeout: 3m
      run: uv run python scripts/validate_plugin_versions.py

    # py-only: markdown/skill edits under plugins/ must not trip the Python suite.
    - name: ruff
      timeout: 3m
      glob:
        - "**/*.py"
        - "pyproject.toml"
      run: >
        uv run ruff check
        plugins/context-eng-hero/scripts
        plugins/rrraw/scripts
        scripts
        tests/context-eng-hero
        tests/rrraw
        tests/scripts

    - name: black
      timeout: 3m
      glob:
        - "**/*.py"
        - "pyproject.toml"
      run: >
        uv run black --check
        plugins/context-eng-hero/scripts
        plugins/rrraw/scripts
        scripts
        tests/context-eng-hero
        tests/rrraw
        tests/scripts

    - name: mypy
      timeout: 3m
      glob:
        - "plugins/*/scripts/**/*.py"
        - "pyproject.toml"
      run: uv run mypy

    - name: bandit
      timeout: 3m
      glob: "plugins/*/scripts/**/*.py"
      run: >
        uv run bandit -q -r
        plugins/context-eng-hero/scripts
        plugins/rrraw/scripts
        -c pyproject.toml

    - name: pip-audit
      timeout: 3m
      glob:
        - "pyproject.toml"
        - "uv.lock"
      run: >
        bash -c 'uv export --frozen --format requirements.txt -o /tmp/requirements.txt >/dev/null
        && uv run pip-audit -r /tmp/requirements.txt'

    - name: pytest
      timeout: 3m
      glob:
        - "**/*.py"
        - "pyproject.toml"
      run: >
        uv run pytest tests/ -q
        --cov=plugins/context-eng-hero/scripts
        --cov=plugins/rrraw/scripts
        --cov=scripts
        --cov-report=xml
