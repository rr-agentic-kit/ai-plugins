repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        types: [python]
      - id: end-of-file-fixer
        types: [python]
      - id: check-yaml
        files: \.(ya?ml)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        pass_filenames: false
        args: [--config-file=pyproject.toml]
        additional_dependencies:
          - types-pyyaml
          - pyyaml

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        types: [python]

  - repo: local
    hooks:
      - id: validate-plugin-versions
        name: validate plugin versions align
        entry: uv run python scripts/validate_plugin_versions.py
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|plugins/[^/]+/\.(cursor|claude)-plugin/plugin\.json)$
